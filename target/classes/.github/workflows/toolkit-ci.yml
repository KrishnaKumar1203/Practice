name: Toolkit checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Java application
        run: mvn --batch-mode --settings .mvn/settings.xml test
      - name: Test JavaScript client
        run: npm run test:toolkit
      - name: Test Python client
        run: python -m unittest discover -s tools/python/tests -v
