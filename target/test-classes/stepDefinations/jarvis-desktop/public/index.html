<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jarvis AI</title>
  <link rel="stylesheet" href="style.css">

  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    #input {
      width: 60%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
    button {
      padding: 10px;
      font-size: 16px;
      margin-left: 5px;
      cursor: pointer;
    }
    #response {
      margin-top: 30px;
      padding: 15px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    pre {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
    }
    code {
      color: #dcdcdc;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>Hello, I'm Jarvis</h1>

  <!-- Text Input -->
  <input type="text" id="input" placeholder="Ask something..." autofocus />
  <button id="sendBtn">Send</button>
  <button id="mic">🎤 Speak</button>
  <p id="status"></p>

  <!-- Response Output -->
  <div id="response">Jarvis will respond here...</div>

  <!-- JS Logic -->
  <script>
    const inputBox = document.getElementById("input");
    const responseBox = document.getElementById("response");

    inputBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    document.getElementById("sendBtn").addEventListener("click", handleSend);

    async function handleSend() {
      const input = inputBox.value.trim();
      if (!input) return;

      responseBox.innerHTML = "<em>Thinking...</em>";

      try {
        const res = await fetch("http://192.168.1.9:5000/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: input })  // ✅ Always use 'prompt'
        });

        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(`Server Error (${res.status}): ${errorText}`);
        }

        const data = await res.json();
        const reply = data.reply || "⚠️ No response from Jarvis.";

        responseBox.innerHTML = marked.parse(reply);

        document.querySelectorAll('pre code').forEach((block) => {
          hljs.highlightElement(block);
        });

        inputBox.value = "";
      } catch (error) {
        console.error("Fetch error:", error);
        responseBox.innerHTML = `<span style="color:red;">❌ Error: ${error.message}</span>`;
      }
    }

    document.getElementById("mic").addEventListener("click", () => {
      const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = "en-US";
      recognition.start();

      document.getElementById("status").textContent = "🎙️ Listening...";

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        inputBox.value = transcript;
        handleSend();
      };

      recognition.onerror = () => {
        document.getElementById("status").textContent = "⚠️ Voice recognition failed.";
      };

      recognition.onend = () => {
        document.getElementById("status").textContent = "";
      };
    });
  </script>
</body>
</html>
