<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jarvis AI</title>
  <link rel="stylesheet" href="style.css">

  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 20px;
    }
    h1 {
      color: #58a6ff;
    }
    #input {
      width: 60%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
    button {
      padding: 10px;
      font-size: 16px;
      margin-left: 5px;
      cursor: pointer;
    }
    #response {
      margin-top: 30px;
      padding: 15px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      white-space: pre-wrap;
      max-height: 500px;
      overflow-y: auto;
    }
    pre {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
    }
    code {
      color: #dcdcdc;
      font-family: monospace;
    }
    #status {
      margin-left: 10px;
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <h1>Hello, I'm Jarvis</h1>

  <!-- Text Input and Controls -->
  <input type="text" id="input" placeholder="Ask something..." autofocus />
  <button id="sendBtn">Send</button>
  <button id="mic">🎤 Speak</button>
  <span id="status"></span>

  <!-- Response Output -->
  <div id="response">Jarvis will respond here...</div>

  <!-- JS Logic -->
  <script src="script.js"></script>
</body>
</html>
